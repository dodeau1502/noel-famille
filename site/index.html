<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Noël">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Listes de Noël</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --surface:#161c26; --ink:#f2f4f8; --muted:#9aa3b2; --line:#2a3342;
    --main:#b8a8ff; --main-ink:#17102f; --soft:#251f3f; --err:#ff8c9b; color-scheme:dark;
    --f-display:"Bebas Neue","Oswald","Impact","Arial Narrow",sans-serif;
    --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --surface:#fff; --ink:#111; --muted:#565d69; --line:#dfe3ea;
    --main:#4b3a8f; --main-ink:#fff; --soft:#ece9f7; --err:#a31d2f; color-scheme:light;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html[data-size="big"]{font-size:118%}
  body{margin:0; background:var(--bg); color:var(--ink); font:1.0625rem/1.5 var(--f-body);
    padding:max(16px,env(safe-area-inset-top,0px)) 16px max(48px,env(safe-area-inset-bottom,0px))}
  main{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
  h1,h2,h3,p{margin:0}
  h1{font:400 clamp(2rem,9vw,2.6rem)/1.05 var(--f-display); text-wrap:balance; overflow-wrap:anywhere}
  h2{font:400 1.45rem/1.2 var(--f-display)}
  h3{font:400 1.35rem/1.2 var(--f-display); overflow-wrap:anywhere}
  button,input{font:inherit; color:inherit}
  a{color:var(--main)}
  :focus-visible{outline:3px solid var(--main); outline-offset:2px; border-radius:8px}
  .muted{color:var(--muted); font-size:.95rem}
  .err{color:var(--err); font-weight:600}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:12px}
  label{display:flex; flex-direction:column; gap:6px; font-weight:600}
  input[type=text],input[type=password],input[type=url],textarea.field{width:100%; min-height:52px; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); font-weight:400}
  input.pin{font-size:1.8rem; letter-spacing:.5em; text-align:center}
  label.check{flex-direction:row; align-items:center; gap:10px; min-height:44px; cursor:pointer}
  label.check input{width:24px; height:24px; accent-color:var(--main); flex:none}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:52px; padding:10px 18px; border-radius:14px; border:1.5px solid var(--main); background:var(--main); color:var(--main-ink); font-weight:700; cursor:pointer; text-align:center; text-decoration:none}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
  .btn.danger{background:transparent; color:var(--err); border-color:var(--err)}
  .btn.small{width:auto; min-height:44px; padding:6px 14px; font-size:.95rem}
  .btn[disabled]{opacity:.45; cursor:default}
  .row{display:flex; gap:8px; flex-wrap:wrap}
  .row > .btn{flex:1 1 0; width:auto; min-width:max-content}
  .row > .btn.small{flex:0 0 auto}
  .link{background:none; border:0; padding:10px 4px; min-height:44px; color:var(--main); font-weight:600; text-decoration:underline; cursor:pointer}
  .back{align-self:flex-start}
  .days{align-self:flex-start; background:var(--soft); color:var(--main); border-radius:999px; padding:5px 14px; font-weight:700; font-size:.92rem}

  .people{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
  .person{display:flex; flex-direction:column; align-items:center; gap:4px; width:100%; height:100%; min-height:128px; padding:14px 8px; background:var(--surface); border:1px solid var(--line); border-radius:18px; cursor:pointer}
  .person i{display:grid; place-items:center; width:58px; height:58px; border-radius:50%; background:var(--c); color:#14101f; font:400 1.9rem/1 var(--f-display); font-style:normal}
  .person b{overflow-wrap:anywhere}
  .person span{color:var(--muted); font-size:.85rem}
  .person em{font-style:normal; font-weight:700; font-size:.82rem; color:var(--main)}
  .mylist{flex-direction:row; justify-content:space-between; align-items:center; cursor:pointer; text-align:left; width:100%; background:var(--soft); border-color:var(--main)}

  .gifts{list-style:none; margin:0; padding:0; display:grid; gap:14px}
  @media (min-width:760px){ main:has(.gifts){max-width:880px} .gifts{grid-template-columns:1fr 1fr} }
  .gift{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden}
  .gift .top{display:block; color:inherit; text-decoration:none}
  .img{display:grid; place-items:center; aspect-ratio:4/3; background:var(--soft); color:var(--main); overflow:hidden}
  .img img{width:100%; height:100%; min-height:0; object-fit:contain; background:#fff; padding:10px; display:block}
  .img svg{width:64px; height:64px}
  .gift .txt{display:flex; flex-direction:column; gap:6px; padding:14px 16px}
  .gift .price{font:400 1.6rem/1.2 var(--f-display)}
  .gift .price small{font:400 .95rem var(--f-body); color:var(--muted); margin-left:8px}
  .gift .see{color:var(--main); font-weight:600; font-size:.95rem}
  .gift .acts{display:flex; flex-direction:column; gap:8px; padding:0 16px 16px; margin-top:auto}
  .gift.taken .img,.gift.taken .txt{opacity:.5}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:0; list-style:none}
  .chips li{background:var(--soft); border-radius:10px; padding:4px 10px; font-size:.95rem; overflow-wrap:anywhere}
  .star{color:var(--main); font-weight:700; font-size:.9rem}
  .state{font-weight:700; background:var(--soft); border-radius:12px; padding:12px 14px; text-align:center}
  [data-progress]:empty{display:none}
  .prog{background:var(--soft); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
  .prog .bar{height:8px; border-radius:99px; background:var(--line); overflow:hidden}
  .prog .bar i{display:block; height:100%; background:var(--main); transition:width .6s ease}
  .prog ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
  .prog li{display:flex; align-items:center; gap:10px; color:var(--muted)}
  .prog li b{display:grid; place-items:center; width:20px; height:20px; flex:none; font-size:.9rem}
  .prog li.done{color:var(--ink)} .prog li.done b{color:var(--main)}
  .prog li.now{color:var(--ink); font-weight:700}
  .prog li.now b{border:3px solid var(--line); border-top-color:var(--main); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .prog li.now b{animation:none} .prog .bar i{transition:none} }
  .danger-zone{border:1.5px solid var(--err); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px}
  .hold{position:relative; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
  .hold i{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--err); opacity:.35; pointer-events:none}
  .hold.on i{width:100%; transition:width 5s linear}
  .hold span{position:relative; pointer-events:none}
  .shares{background:var(--soft); border-radius:12px; padding:10px 14px}
  .shares ul{margin:4px 0 0; padding-left:18px}
  .photo{align-self:center; max-width:100%; max-height:180px; border-radius:12px; background:#fff}
  details > summary{cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600}
  details[open] > summary{margin-bottom:8px}
  details.card{gap:0}
  details.card > * + *{margin-top:10px}
  .thumb{width:72px; height:72px; flex:none; border-radius:12px; aspect-ratio:auto}
  .thumb img{padding:4px}
  .thumb svg{width:34px; height:34px}
  .line{display:flex; gap:12px; align-items:flex-start}
  .line > div{min-width:0; overflow-wrap:anywhere}

  .offer{display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); padding-top:10px}
  .offer:first-of-type{border-top:0; padding-top:0}
  .foot{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 18px; padding-top:8px}
  textarea{width:100%; min-height:120px; padding:10px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:inherit; font:inherit; font-size:.95rem}
.steps{padding-left:1.4em;margin:0 0 14px}.mview{margin-top:14px;padding-top:12px;border-top:1px solid var(--line, #2a3342)}.peers{padding-left:1.6em}.steps li{margin:8px 0}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="muted">Chargement…</p></main>
<noscript><p>Cette page a besoin de JavaScript.</p></noscript>
<script>
const SUPABASE_KEY = "__SUPABASE_ANON_KEY__"; // remplacé par le serveur au service de la page (clé publique par conception)
const app = document.getElementById("app");
// Téléphone ou tablette (écran tactile) : le favori y est trop compliqué à installer, la capture d'écran le remplace
const PHONE = matchMedia("(pointer: coarse)").matches;
const store = {
  get(k){ try{ return localStorage.getItem(k) || "" }catch(e){ return "" } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
let token = store.get("session");
let home = null, list = null, admin = null, trash = [];   // dernières réponses du serveur
let draft = null;                                  // cadeau en cours d'ajout ou de modification
let invite = null;                                 // lien d'activation affiché à l'administrateur
let confirming = "", error = "", busy = false, lastHtml = "";
const opened = new Set();                          // blocs dépliés, gardés ouverts quand l'écran est redessiné
let danger = {key:"", step:0};                     // action sensible en cours de validation

const MSG = {
  denied:"Action impossible.", throttled:"Trop d'essais. Réessaie dans quelques minutes.",
  locked:"Trop d'erreurs : ce compte est bloqué un moment. Réessaie plus tard.",
  used:"Ce lien a déjà servi. Connecte-toi avec ton identifiant et ton code.",
  taken:"Quelqu'un vient de prendre ce cadeau.", exists:"Ce nom ou cet identifiant existe déjà.",
  invalid:"Vérifie les champs puis réessaie.", full:"La liste est pleine (100 cadeaux).",
  session:"Reconnecte-toi.", pin:"Écris ton code à 4 chiffres.", oldpin:"L'ancien code n'est pas le bon.",
  shared:"Des personnes participent déjà à ce cadeau : tu peux participer aussi."
};
async function post(path, body){
  let r;
  try{
    r = await fetch(location.origin + path, {method:"POST",
      headers:{apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, "Content-Type":"application/json"},
      body:JSON.stringify(body)});
  }catch(e){ throw new Error("Pas de connexion internet. Réessaie.") }
  const d = await r.json().catch(()=>null);
  if(!r.ok || !d) throw new Error("Une erreur est survenue. Réessaie dans un instant.");
  return d;
}
async function rpc(fn, args){
  const d = await post("/rest/v1/rpc/" + fn, args);
  if(d.error) throw Object.assign(new Error(MSG[d.error] || "Une erreur est survenue."), {code:d.error});
  return d;
}
const api = (fn, args = {}) => rpc(fn, {p_token:token, ...args});

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const webUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const imgUrl = u => /^https:\/\//i.test(u || "") ? u : "";
const eur = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:Number.isInteger(+n)?0:2}).format(n);
const plural = n => n === 0 ? "liste vide" : n + (n > 1 ? " cadeaux" : " cadeau");
const errHtml = () => error ? `<p class="err" role="alert">${esc(error)}</p>` : "";
const GIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';
const picture = (u, cls = "") => `<div class="img ${cls}">${imgUrl(u) ? `<img src="${esc(u)}" alt="" loading="lazy">` : GIFT}</div>`;
const COLORS = ["#b8a8ff","#ffb4a2","#9fe0c0","#ffd98a","#a8d4ff","#f4b0dc","#cfe58c","#8fdde7"];
const amountOf = v => { const raw = String(v).replace(/[€\s]/g, "").replace(",", "."); return raw === "" ? null : Number(raw); };
const total = shares => shares.reduce((n, x) => n + Number(x.amount), 0);
const sharesHtml = (shares, price) => `<div class="shares"><b>${eur(total(shares))} réunis${price != null ? " sur environ " + eur(price) : ""}</b>
  <ul>${shares.map(x => `<li>${x.mine ? "Toi" : esc(x.name)} : ${eur(x.amount)}</li>`).join("")}</ul></div>`;
const shareForm = (id, current) => `<form class="card" data-form="share" data-id="${id}">
  <label>Combien veux-tu mettre ? (€)<input type="text" name="amount" inputmode="decimal" maxlength="9" required value="${current != null ? esc(String(current).replace(".", ",")) : ""}"></label>
  <div class="row"><button class="btn">Valider</button><button type="button" class="btn ghost" data-confirm="">Annuler</button></div></form>`;
const backBtn = (to, label) => `<button type="button" class="link back" data-go="${to}">← ${label}</button>`;

/* ---------- Adresses : "" menu, #liste/3, #ajouter, #modifier/12, #famille, #inv=…, #installation ---------- */
const route = () => location.hash.replace(/^#\/?/, "");
const go = h => { if(route() === h) show(); else location.hash = h; };

/* ---------- Écrans sans connexion ---------- */
function loginView(note){
  return `<h1>Listes de Noël</h1>
  <form class="card" data-form="login">
    ${note ? `<p>${esc(note)}</p>` : ""}
    <label>Ton identifiant<input type="text" name="login" autocomplete="username" autocapitalize="none" required maxlength="40" value="${esc(store.get("login"))}"></label>
    <label>Ton code à 4 chiffres<input class="pin" type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password"></label>
    ${errHtml()}
    <button class="btn">Entrer</button>
    <details data-k="forgot"${opened.has("forgot") ? " open" : ""}><summary>Code oublié ?</summary><p>Demande à Dorian de le réinitialiser. Ensuite, écris ton identifiant ici, laisse le code vide et touche « Entrer » : tu pourras en choisir un nouveau.</p></details>
    <p class="muted">Pas encore d'accès ? Demande ton lien d'invitation.</p>
  </form>`;
}
const activateView = who => `<h1>Bonjour ${esc(who.name)} !</h1>
  <form class="card" data-form="activate">
    <p>Choisis ${who.reset ? "un nouveau" : "un"} code secret à 4 chiffres.</p>
    <p>Ton identifiant : <b>${esc(who.login)}</b></p>
    <input type="text" name="username" autocomplete="username" value="${esc(who.login)}" hidden>
    <label>Ton code<input class="pin" type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required></label>
    <label>Encore une fois<input class="pin" type="password" name="pin2" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password" required></label>
    ${errHtml()}
    <button class="btn">C'est parti</button>
  </form>`;
const setupView = () => `<h1>Installation</h1>
  <form class="card" data-form="setup">
    <p>Pour la personne qui gère le site. La première fois, la liste actuelle devient la sienne. Plus tard, sert à retrouver son accès si elle a oublié son code.</p>
    <label>Ancien code propriétaire<input type="password" name="code" required maxlength="100" autocomplete="off"></label>
    <label>Ton prénom<input type="text" name="name" required maxlength="40" autocomplete="given-name"></label>
    <label>Ton identifiant<input type="text" name="login" required minlength="2" maxlength="30" autocapitalize="none" autocomplete="off"></label>
    ${errHtml()}
    <button class="btn">Continuer</button>
  </form>`;

/* ---------- Menu ---------- */
const days = () => {
  const now = new Date(), d = new Date(now.getFullYear(), 11, 25), n = Math.round((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  return n > 1 ? `Noël dans ${n} jours` : n === 1 ? "Noël est demain" : n === 0 ? "Joyeux Noël !" : "";
};
const personBtn = m => `<li><button type="button" class="person" data-go="liste/${m.id}"><i aria-hidden="true" style="--c:${COLORS[m.id % COLORS.length]}">${esc([...m.name][0].toUpperCase())}</i><b>${esc(m.name)}</b><span>${plural(m.count)}</span>${m.offered ? `<em>✓ tu offres ${m.offered}</em>` : ""}</button></li>`;
// Conseil affiché une fois : mettre le site sur l'écran d'accueil
const tip = () => store.get("tip") || matchMedia("(display-mode: standalone)").matches || navigator.standalone ? "" : `<section class="card"><p><b>Astuce :</b> mets le site sur l'écran d'accueil de ton téléphone. iPhone : bouton Partager puis « Sur l'écran d'accueil ». Android : menu ⋮ puis « Ajouter à l'écran d'accueil ».</p><button type="button" class="btn ghost" data-tip>J'ai compris</button></section>`;
function homeView(){
  const me = home.me;
  const groups = home.groups.filter(g => g.members.length).map(g => `<h2>${home.groups.length > 1 ? esc(g.name) : "Les listes de la famille"}</h2><ul class="people">${g.members.map(personBtn).join("")}</ul>`).join("");
  const offering = home.offering.length ? `<section class="card"><h2>Ce que j'offre</h2>${home.offering.map(o => `<div class="offer">
      <div class="line">${picture(o.image, "thumb")}<div><p><b>${esc(o.title)}</b></p><p>pour ${esc(o.ownerName)}${o.price != null ? " · environ " + eur(o.price) : ""}</p>${o.details ? `<p class="muted">${esc(o.details)}</p>` : ""}</div></div>
      ${o.removed ? `<p class="err">Ce cadeau a été retiré de la liste de ${esc(o.ownerName)}.</p>` : o.changed ? `<p class="err">Ce cadeau a été modifié : vérifie avant d'acheter.</p>` : ""}
      ${o.amount != null ? sharesHtml(o.shares, o.price) : `<label class="check"><input type="checkbox" data-bought="${o.id}"${o.bought ? " checked" : ""}> C'est acheté</label>`}
      <div class="row">${webUrl(o.url) ? `<a class="btn ghost small" href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">Voir</a>` : ""}<button type="button" class="btn ghost small" data-release="${o.id}">${o.amount != null ? "Retirer ma participation" : "Je ne l'offre plus"}</button></div>
    </div>`).join("")}</section>` : "";
  return `${days() ? `<span class="days">${days()}</span>` : ""}
  <h1>Bonjour ${esc(me.name)}</h1>
  ${me.hasList === false ? `<p class="muted">Ici, tu choisis ce que tu offres sur les listes des autres.</p>` : `
  <button type="button" class="card mylist" data-go="liste/${me.id}"><span><h2>Ma liste</h2><span class="muted">${plural(me.count)}</span></span><span aria-hidden="true">→</span></button>
  <button type="button" class="btn" data-go="ajouter">+ Ajouter un cadeau à ma liste</button>
  ${PHONE ? "" : `<button type="button" class="link" data-go="favori">🎁 Ajouter en un geste depuis le site d'un magasin</button>`}
  ${me.count ? "" : `<p class="muted">Commence par ajouter ta première idée : les autres sauront quoi t'offrir.</p>`}`}
  ${errHtml()}
  ${groups || `<p class="muted">Les listes des autres apparaîtront ici.</p>`}
  ${offering}
  ${tip()}
  ${me.admin ? `<button type="button" class="btn ghost" data-go="famille">Gérer la famille</button>` : ""}
  <div class="foot">
    <button type="button" class="link" data-size>Texte ${document.documentElement.dataset.size === "big" ? "normal" : "plus grand"}</button>
    <button type="button" class="link" data-theme-toggle>Fond ${document.documentElement.dataset.theme === "light" ? "sombre" : "clair"}</button>
    <button type="button" class="link" data-go="code">Changer mon code</button>
    <button type="button" class="link" data-logout>Se déconnecter</button>
  </div>`;
}

/* ---------- Une liste ---------- */
function giftHtml(g, mine){
  const editBtn = mine || !home.me.admin ? "" : `<button type="button" class="link" data-go="modifier/${g.id}/${list.member.id}">Modifier ce cadeau</button>`;
  const url = webUrl(g.url), shares = mine ? [] : g.shares, my = shares.find(x => x.mine), taken = !mine && g.taken && !g.mine;
  const tag = url ? "a" : "div", href = url ? ` href="${esc(url)}" target="_blank" rel="noopener noreferrer"` : "";
  const chips = [g.size ? "Taille : " + g.size : "", g.color ? "Couleur : " + g.color : "", g.note].filter(Boolean);
  let acts;
  if(mine) acts = `<button type="button" class="btn ghost" data-go="modifier/${g.id}">Modifier</button>`;
  else if(g.mine) acts = `<p class="state">✓ C'est toi qui l'offres</p><button type="button" class="btn ghost" data-release="${g.id}">Annuler</button>`;
  else if(g.taken) acts = `<p class="state">${g.by ? "Pris par " + esc(g.by) : "Déjà pris"}</p>`;
  else{
    const form = confirming === "s" + g.id;

/* ---------- Écran d'attente par étapes ---------- */
// Les étapes avancent au temps écoulé (seconde de début de chacune) : le serveur ne dit pas où il en est. La dernière reste
// en cours tant que la réponse n'est pas arrivée.
const STEPS = {
  capture: [[0,"Envoi de l'image"], [2,"Lecture de l'image"], [6,"Recherche du nom"], [11,"Recherche du prix"], [17,"Taille et couleur"], [23,"Recherche du lien"], [30,"Préparation de la fiche"]],
  link: [[0,"Ouverture du lien"], [2,"Lecture du nom"], [4,"Lecture du prix"], [6,"Chargement de la photo"], [9,"Préparation de la fiche"]]
};
let prog = null;
function progDraw(){
  if(!prog) return;
  const t = (Date.now() - prog.t0) / 1000, steps = STEPS[prog.kind], now = steps.filter(x => x[0] <= t).length - 1;
  const slow = t > steps[steps.length-1][0] + 10, key = prog.kind + now + slow;
  app.querySelectorAll(`[data-progress="${prog.kind}"]`).forEach(el => {
    if(el.dataset.at === key) return;
    el.dataset.at = key;
    el.innerHTML = `<div class="prog" role="status"><div class="bar"><i style="width:${Math.round((now + .6) / steps.length * 100)}%"></i></div>
      <ul>${steps.map((x, i) => `<li class="${i < now ? "done" : i === now ? "now" : ""}"><b aria-hidden="true">${i < now ? "✓" : i === now ? "" : "·"}</b>${x[1]}${i === now ? "…" : ""}</li>`).join("")}</ul>
      ${slow ? `<p class="muted">C'est un peu plus long que d'habitude, patiente encore.</p>` : ""}</div>`;
  });
}
function progStart(kind){ progStop(); prog = {kind, t0:Date.now(), timer:setInterval(progDraw, 500)}; progDraw(); }
function progStop(){
  if(prog){ clearInterval(prog.timer); prog = null; }
  app.querySelectorAll("[data-progress]").forEach(el => { el.innerHTML = ""; delete el.dataset.at; });
}

/* ---------- Favori « Ma liste de Noël » (lit la page du magasin dans le navigateur de la personne) ---------- */
// Le favori contient favori.txt (copie de extension/extract.js) puis sendToList. Il s'exécute sur la page du MAGASIN, déjà affichée
// à la personne : aucun mur anti-robots n'est contourné, rien n'est lu par notre serveur. Il ouvre la liste avec #ajout=<données>.
// sendToList doit rester autonome (converti en texte) : n'utiliser que extractPage et le paramètre base.
function sendToList(base){
  let o = {};
  try{ o = extractPage(); }catch(e){ o = {url:location.href, title:document.title}; }
  const num = v => {
    let t = String(v == null ? "" : v).replace(/[^\d.,]/g, ""); if(!t) return null;
    const c = t.lastIndexOf(","), d = t.lastIndexOf(".");
    t = c > d ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
    const n = parseFloat(t); return isFinite(n) && n > 0 && n < 100000 ? Math.round(n * 100) / 100 : null;
  };
  let price = num(o.price);
  if(price == null){
    // Prix seulement affiché à l'écran : premier montant en euros visible, hors prix barré
    const skip = 's,del,header,nav,footer,[class*="strike" i],[class*="old-price" i],[class*="oldprice" i],[class*="price-old" i],[class*="was-price" i],[class*="original" i],[class*="compare" i],[class*="crossed" i]';
    for(const el of document.querySelectorAll('[class*="price" i],[data-testid*="price" i],[id*="price" i],[itemprop="price"]')){
      if(!(el.offsetWidth || el.offsetHeight) || el.children.length > 4 || el.closest(skip)) continue;
      if(/line-through/.test(getComputedStyle(el).textDecorationLine || "")) continue;
      const t = (el.textContent || "").replace(/\s+/g, " ");
      const m = t.match(/(\d[\d \u202f\u00a0.]*(?:,\d{1,2})?)\s*(?:€|EUR)/) || t.match(/€\s*(\d[\d \u202f\u00a0.,]*)/);
      if(m && (price = num(m[1])) != null) break;
    }
  }
  const data = {u:o.url || location.href, t:o.title || document.title || "", i:o.image || "", p:price, v:o.variant || ""};
  const url = base + "/#ajout=" + encodeURIComponent(JSON.stringify(data));
  const w = window.open(url, "_blank");
  if(!w) location.href = url;
}

let reading = false;   // capture en cours de lecture

// Image de l'appareil → JPEG réduit (côté le plus long ≤ max), recadré si box ([ymin, xmin, ymax, xmax] de 0 à 1000). Renvoie le base64.
async function shrink(file, max, quality, box){
  let img;
  try{ img = await createImageBitmap(file); }catch(e){ throw new Error("Cette image n'a pas pu être lue : choisis une photo ou une capture d'écran (JPEG ou PNG)."); }
  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if(box){ const [y0, x0, y1, x1] = box; sx = x0 / 1000 * img.width; sy = y0 / 1000 * img.height; sw = (x1 - x0) / 1000 * img.width; sh = (y1 - y0) / 1000 * img.height; }
  const k = Math.min(1, max / Math.max(sw, sh)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  if(img.close) img.close();
  return c.toDataURL("image/jpeg", quality).split(",")[1];
}
// Photo enregistrée dans la base (noel_photo_add) → adresse https de la photo sur ce site
async function sendPhoto(file, box){
  let b = await shrink(file, 1000, 0.82, box);

const CAPTURE_MSG = {off:"La lecture des captures n'est pas encore activée sur le site.", noproduct:"Je ne vois pas de produit sur cette capture.",
  throttled:"Trop de captures d'un coup : réessaie dans un moment.", big:"Cette image est trop grande.", busy:"Le service de lecture est occupé : réessaie dans une minute.",
  ai:"La lecture n'a pas marché. Réessaie, ou écris le nom du cadeau."};
async function readCapture(file){
  const b = await shrink(file, 1600, 0.8);

  }catch(e){ throw new Error("Pas de connexion internet. Réessaie.") }
  d = await r.json().catch(()=>null);
  if(d && d.error === "session") throw Object.assign(new Error(MSG.session), {code:"session"});
  if(!r.ok || !d || d.error) throw new Error(CAPTURE_MSG[d && d.error] || CAPTURE_MSG.ai);
  const out = {step:2, id:null, title:d.title || "", size:d.size || "", color:d.color || "", note:(d.details || "").slice(0,500), top:false,

  if(!out.image && Array.isArray(d.box)) try{ out.image = await sendPhoto(file, d.box); }catch(e){}
  out.hint = "Lu sur ta capture : vérifie, complète si besoin, puis enregistre." +
    (d.found === "search" ? " Le lien a été trouvé par une recherche : ouvre-le pour vérifier que c'est le bon produit." : !out.url ? " Je n'ai pas trouvé le lien : colle-le si tu l'as." : "");
  return out;
}

/* ---------- Actions sensibles : 3 validations, la dernière en restant appuyé 5 secondes ---------- */
const HOLD_MS = 5000;
const dangerOpen = (key, label, cls = "link") => `<button type="button" class="${cls}" data-danger="${key}">${label}</button>`;
function dangerBox(key, o){
  if(danger.key !== key) return dangerOpen(key, o.label, o.cls);
  const stop = `<button type="button" class="btn ghost" data-danger="">Annuler</button>`;
  const step = n => `<p class="muted">Validation ${n} sur 3</p>`;
  if(danger.step === 1) return `<div class="danger-zone">${step(1)}<p><b>${o.question}</b></p><button type="button" class="btn danger" data-next>Oui, je veux continuer</button>${stop}</div>`;
  if(danger.step === 2) return `<div class="danger-zone">${step(2)}<p>${o.effect}</p>
    <label class="check"><input type="checkbox" data-understood> J'ai lu et compris</label>
    <button type="button" class="btn danger" data-next disabled>Continuer</button>${stop}</div>`;
  return `<div class="danger-zone">${step(3)}<p>Reste appuyé 5 secondes. Relâcher annule.</p>
    <button type="button" class="btn danger hold" data-hold="${key}"><i></i><span>${o.hold}</span></button>${stop}</div>`;
}
const DANGER = {
  mdel: id => api("noel_admin_member_remove", {p_member:id}).then(()=>{ invite = null; }),
  gdel: id => api("noel_admin_group_remove", {p_group:id}),
  reset: id => api("noel_admin_reset", {p_member:id})
};
let holding = null;
function holdStart(b){
  if(holding || busy) return;
  b.classList.add("on");
  holding = {b, timer:setTimeout(()=>{
    const [kind, id] = b.dataset.hold.split(":");
    holding = null; danger = {key:"", step:0};
    run(()=>DANGER[kind](+id));
  }, HOLD_MS)};
}
function holdStop(){
  if(!holding) return;
  clearTimeout(holding.timer); holding.b.classList.remove("on"); holding = null;
}
app.addEventListener("pointerdown", e=>{ const b = e.target.closest("[data-hold]"); if(b && e.button === 0) holdStart(b); });
for(const type of ["pointerup","pointercancel"]) window.addEventListener(type, holdStop);
app.addEventListener("pointerout", e=>{ if(holding && e.target === holding.b && !holding.b.contains(e.relatedTarget)) holdStop(); });
app.addEventListener("keydown", e=>{ const b = e.target.closest("[data-hold]"); if(b && (e.key === " " || e.key === "Enter")){ e.preventDefault(); if(!e.repeat) holdStart(b); } });
app.addEventListener("keyup", holdStop);
app.addEventListener("contextmenu", e=>{ if(e.target.closest("[data-hold]")) e.preventDefault(); });   // pas de menu à l'appui long
window.addEventListener("blur", holdStop);
document.addEventListener("visibilitychange", holdStop);
window.addEventListener("hashchange", holdStop);

/* ---------- Affichage ---------- */
function paint(html){
  if(html === lastHtml) return;
  lastHtml = html; app.innerHTML = html;
}
function toLogin(note){ token = ""; store.del("session"); home = list = admin = draft = null; paint(loginView(note)); }
function fail(e){
  if(e.code === "session"){ toLogin(MSG.session); return; }
  error = e.message; render();
}
let pre = null;   // écran avant connexion : {kind:"activate"|"setup", …}
function render(){
  if(pre) return paint(pre.kind === "setup" ? setupView() : activateView(pre));
  if(!token) return paint(loginView());
  const r = route();
  if(!home) return paint(error ? errHtml() + `<button type="button" class="btn" data-retry>Réessayer</button>` : `<p class="muted">Chargement…</p>`);
  if(r.startsWith("liste/") && list) return paint(listView());
  if((r.startsWith("ajouter") || r.startsWith("modifier/")) && draft) return paint(editView());
  if(r === "famille" && admin) return paint(adminView());
  if(r === "code") return paint(codeView());
  if(r === "favori") return paint(favoriView());
  paint(homeView());
}
// Données de l'écran courant
async function load(){
  const r = route();
  const h = await api("noel_home");
  let l = null, a = null;
  // liste/3 · ajouter/3 · modifier/12/3 : le dernier nombre est la personne ; sans lui, c'est moi
  const [page, a1, a2] = r.split("/"), who = +(page === "modifier" ? a2 : a1) || h.me.id;
  if(page === "liste" || page === "modifier" || (page === "ajouter" && a1)) l = await api("noel_list", {p_member:who});
  if(r === "famille" && h.me.admin){ a = await api("noel_admin"); a.views = (await api("noel_admin_views")).members; }
  let t = [];
  if(page === "liste" && l && (l.mine || h.me.admin)) t = (await api("noel_trash", {p_member:who})).gifts;
  if(r !== route()) return;                 // l'écran a changé pendant le chargement
  home = h; list = l; admin = a; trash = t;
}
async function show(){
  const r = route();
  error = ""; confirming = ""; opened.clear(); danger = {key:"", step:0};
  const inv = r.match(/^inv=([a-f0-9]{32})$/);
  if(inv){
    try{ const i = await rpc("noel_invite_info", {p_invite:inv[1]}); pre = {kind:"activate", token:inv[1], name:i.name, login:i.login}; render(); }
    catch(e){ pre = null; history.replaceState(null, "", location.pathname); if(token) return show(); error = e.message; render(); }
    return;
  }
  if(r === "installation"){ pre = {kind:"setup"}; render(); return; }
  const add = r.match(/^ajout=([\s\S]{1,8000})$/);
  if(add){
    try{ const p = JSON.parse(decodeURIComponent(add[1])); if(p && typeof p === "object" && !Array.isArray(p)) session.set(p); }catch(e){}
    history.replaceState(null, "", location.pathname + "#ajouter"); return show();
  }
  pre = null;
  if(!token){ render(); return; }
  // Connexion faite après un envoi du favori : on reprend l'ajout
  if(r === "" && session.get()){ history.replaceState(null, "", location.pathname + "#ajouter"); return show(); }
  if(r !== "famille") invite = null;
  if(r.startsWith("ajouter") || r.startsWith("modifier/")) await checkCapture();
  if(r === "ajouter"){ const p = session.get(); session.del(); draft = p ? fromPage(p) : {step:1}; }
  else if(r.startsWith("ajouter")) draft = {step:1};
  else if(!r.startsWith("modifier/")) draft = null;
  try{
    await load();
    if(r.startsWith("ajouter/")) Object.assign(draft, {owner:list.member.id, ownerName:list.member.name});
    if(r.startsWith("modifier/")){
      const g = list && list.gifts.find(x => x.id === +r.split("/")[1]);
      if(!g) return go("");
      draft = {step:2, id:g.id, title:g.title, size:g.size || "", color:g.color || "", note:g.note || "", price:priceText(g.price), url:g.url || "", readUrl:g.url || "", image:g.image || "", store:g.store || "", top:g.top, hint:"", owner:list.member.id, ownerName:list.member.name};
    }
    if(r === "favori"){ render(); await loadFav().catch(()=>{}); }
    render(); window.scrollTo(0,0);
  }catch(e){
    if(e.code === "denied") return go("");
    fail(e);
  }
}
// Exécute une action puis recharge l'écran
async function run(fn){
  if(busy) return;
  busy = true; error = "";
  try{ await fn(); confirming = ""; if(token && !pre) await load(); render(); }
  catch(e){
    if(e.code === "taken" || e.code === "shared"){ confirming = ""; await load().catch(()=>{}); }
    fail(e);
  }finally{ busy = false; }
}
async function signedIn(t){
  token = t; store.set("session", t); store.del("c"); store.del("is_owner");
  // Réservations faites sur cet appareil avant les comptes
  for(const k of ["nom", "ftok"]){
    const v = store.get(k);
    if(v) try{ await api("noel_adopt", {p_old:v}); store.del(k); }catch(e){}
  }
  pre = null; home = null;
  history.replaceState(null, "", location.pathname);
  await show();
}

app.addEventListener("submit", async e=>{
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, v = n => f.elements.namedItem(n).value.trim();
  if(busy) return;
  if(kind === "login") return run(async()=>{
    store.set("login", v("login"));
    try{
      const d = await rpc("noel_login", {p_login:v("login"), p_pin:v("pin")});
      if(d.reset){ pre = {kind:"activate", reset:true, name:d.name, login:d.login}; return; }
      await signedIn(d.token);
    }
    catch(err){ if(err.code === "denied") err.message = "Identifiant ou code incorrect."; throw err; }
  });
  if(kind === "activate"){
    if(v("pin") !== v("pin2")){ error = "Les deux codes sont différents."; render(); return; }
    return run(async()=>{
      const d = pre.reset ? await rpc("noel_reset_choose", {p_login:pre.login, p_pin:v("pin")}) : await rpc("noel_activate", {p_invite:pre.token, p_pin:v("pin")});
      store.set("login", pre.login); await signedIn(d.token);
    });
  }
  if(kind === "setup") return run(async()=>{
    try{ const d = await rpc("noel_setup", {p_owner_code:f.elements.code.value, p_name:v("name"), p_login:v("login")}); location.hash = "inv=" + d.invite; }
    catch(err){ if(err.code === "denied") err.message = "Code incorrect."; throw err; }
  });
  if(kind === "start"){
    const q = v("q"); if(!q) return;
    busy = true; const b = f.querySelector("button"); b.disabled = true;
    if(/https?:\/\/\S+/i.test(q)){ progStart("link"); }
    const {owner, ownerName} = draft;
    try{ await startGift(q); Object.assign(draft, {owner, ownerName}); }finally{ busy = false; progStop(); }
    if(route().startsWith("ajouter")){ lastHtml = ""; render(); }
    return;
  }
  if(kind === "code"){
    if(v("pin") !== v("pin2")){ error = "Les deux nouveaux codes sont différents."; render(); return; }
    return run(async()=>{ await api("noel_change_pin", {p_old:v("old"), p_new:v("pin")}); location.hash = ""; });
  }
  if(kind === "share"){
    const amount = amountOf(v("amount"));
    if(!(amount >= 1 && amount < 100000)){ error = "Écris un montant en chiffres, par exemple 20."; render(); return; }
    return run(()=>api("noel_share", {p_gift:+f.dataset.id, p_amount:amount}));
  }
  if(kind === "gift"){
    const current = draft;
    if(current.saving) return;
    current.saving = true;                       // un seul enregistrement, même touché deux fois
    await current.reading;                       // lien encore en cours de lecture
    current.saving = false;
    if(draft !== current || !giftForm()) return;
    readForm();
    const d = draft, price = amountOf(d.price), url = cleanLink(d.url), image = d.image.trim();
    if(price !== null && !(price > 0 && price < 100000)){ error = "Écris le prix avec des chiffres, par exemple 25."; render(); return; }
    if(image && !imgUrl(image)){ error = "L'adresse de la photo doit commencer par https://"; render(); return; }
    return run(async()=>{
      await api("noel_gift_save", {p_id:d.id, p_title:d.title.trim(), p_url:url, p_size:d.size.trim(), p_color:d.color.trim(), p_note:d.note.trim(),
        p_image:image, p_price:price, p_store:url ? d.store : "", p_top:d.top, p_owner:d.owner || null});
      const back = listBack(); draft = null; location.hash = back;
    });
  }
  if(kind === "member") return run(async()=>{
    const name = v("name"), groups = [...f.querySelectorAll('input[name="g"]:checked')].map(i => +i.value);
    const d = await api("noel_admin_member_add", {p_name:name, p_login:v("login") || name, p_groups:groups});
    if(f.elements.nolist.checked){
      const a = await api("noel_admin"), m = a.members.find(x => x.login === d.login);
      if(m) await api("noel_admin_member_view", {p_member:m.id, p_has_list:false, p_sees_all:true, p_sees:[]});
    }
    f.reset();
    invite = {name, login:d.login, token:d.invite};
    window.scrollTo(0,0);
  });
  if(kind === "group") return run(async()=>{ await api("noel_admin_group_add", {p_name:v("name")}); f.reset(); });
  if(kind === "mview") return run(async()=>{
    const all = f.querySelector('input[name="all"]:checked').value === "1";
    const sees = [...f.querySelectorAll('input[name="sees"]:checked')].map(i => +i.value);
    await api("noel_admin_member_view", {p_member:+f.dataset.id, p_has_list:f.elements.hasList.checked, p_sees_all:all, p_sees:sees});
  });
});

app.addEventListener("click", async e=>{

  if("go" in d) return go(d.go);

    try{ await navigator.clipboard.writeText(favLink); app.querySelector("[data-favcopied]").hidden = false; }

  if("danger" in d){ danger = {key:d.danger, step:d.danger ? 1 : 0}; return render(); }
  if("next" in d){ danger.step++; return render(); }
  if("hold" in d) return;                       // seul l'appui long agit
  if("grestore" in d) return run(()=>api("noel_admin_group_restore", {p_entry:+d.grestore}));
  if("confirm" in d){ readForm(); confirming = d.confirm; error = ""; return render(); }
  if("tip" in d){ store.set("tip", "1"); return render(); }
  if("nophoto" in d){ readForm(); draft.image = ""; opened.delete("photo"); return render(); }
  if("restore" in d) return run(()=>api("noel_gift_restore", {p_id:+d.restore}));
  if("mrestore" in d) return run(()=>api("noel_admin_member_restore", {p_member:+d.mrestore}));

  if("release" in d) return run(()=>api("noel_release", {p_gift:+d.release}));
  if("delyes" in d) return run(async()=>{ const back = listBack(); await api("noel_gift_delete", {p_id:+d.delyes}); draft = null; location.hash = back; });
  if("reinvite" in d) return run(async()=>{
    const m = admin.members.find(x => x.id === +d.reinvite);
    const r = await api("noel_admin_invite", {p_member:m.id});

  });
  if("share" in d){
    const text = inviteText(invite);
    if(navigator.share){ try{ await navigator.share({text}); }catch(err){} return; }
    try{ await navigator.clipboard.writeText(text); t.textContent = "Copié ✓"; }catch(err){ document.getElementById("inviteText").select(); }
  }
});

app.addEventListener("toggle", e=>{

  e.target.open ? opened.add(k) : opened.delete(k);

app.addEventListener("change", e=>{
  const i = e.target;
  if("capture" in i.dataset && i.files && i.files[0]){
    const file = i.files[0], {owner, ownerName} = draft;
    reading = true; error = ""; lastHtml = ""; render(); progStart("capture");
    readCapture(file).then(d => { if(!route().startsWith("ajouter")) return; draft = Object.assign(d, {owner, ownerName}); window.scrollTo(0,0); })
      .catch(err => { if(err.code === "session") return fail(err); error = err.message; })
      .finally(() => { reading = false; progStop(); lastHtml = ""; render(); });
    return;
  }
  if("capture2" in i.dataset && i.files && i.files[0]){
    const msg = app.querySelector("[data-capmsg]"), d = draft;
    if(msg) msg.hidden = true;
    progStart("capture");
    readCapture(i.files[0]).then(c => {
      if(draft !== d || !giftForm()) return;
      progStop();
      readForm();
      if(c.title && d.guessedTitle && d.title === d.guessedTitle) d.title = c.title;   // nom deviné, pas retouché : le vrai nom le remplace
      for(const k of ["title", "price", "size", "color"]) if(!String(d[k]).trim() && c[k]) d[k] = c[k];
      if(!d.note.trim() && c.note) d.note = c.note;
      if(!imgUrl(d.image) && c.image) d.image = c.image;
      if(!d.url.trim() && c.url){ d.url = d.readUrl = c.url; }
      for(const k of ["title","price","size","color","note","url","image"]) giftForm().elements.namedItem(k).value = d[k];
      showPhoto(); if(msg) msg.hidden = true;
      showHint(imgUrl(d.image) ? "Capture lue : vérifie puis enregistre." : "Capture lue, mais je n'y ai pas trouvé de photo du produit.");
    }).catch(err => { progStop(); if(err.code === "session") return fail(err); if(msg){ msg.textContent = err.message; msg.hidden = false; } });
    return;
  }
  if("photo" in i.dataset && i.files && i.files[0]){
    const msg = app.querySelector("[data-photomsg]"), d = draft;
    if(msg){ msg.textContent = "J'envoie la photo…"; msg.hidden = false; }
    sendPhoto(i.files[0]).then(u => {
      if(draft !== d || !giftForm()) return;
      readForm(); d.image = u; giftForm().elements.namedItem("image").value = u; showPhoto();
      if(msg) msg.hidden = true;
    }).catch(err => { if(msg){ msg.textContent = err.code === "session" ? MSG.session : (err.message || "La photo n'a pas pu être envoyée."); msg.hidden = false; } });
    return;
  }
  if("understood" in i.dataset){ i.closest(".danger-zone").querySelector("[data-next]").disabled = !i.checked; return; }
  if(i.closest('form[data-form="gift"]')){
    if(i.name === "url") linkChanged();
    if(i.name === "image"){ readForm(); showPhoto(); }
    return;
  }
  if(i.dataset.bought) return run(()=>api("noel_bought", {p_gift:+i.dataset.bought, p_bought:i.checked}));
  if(i.dataset.mgroup){
    const id = +i.dataset.mgroup, groups = [...app.querySelectorAll(`input[data-mgroup="${id}"]:checked`)].map(x => +x.value);
    return run(()=>api("noel_admin_member_groups", {p_member:id, p_groups:groups}));
  }
});
// Photo disparue du site du magasin : on la retire de l'écran
app.addEventListener("error", e=>{ if(e.target.tagName === "IMG" && e.target.parentElement) e.target.parentElement.innerHTML = GIFT; }, true);

// Mise à jour discrète du menu et des listes (jamais pendant une saisie)
function tick(){
  const r = route();
  if(!token || pre || busy || confirming || document.hidden || !(r === "" || r.startsWith("liste/"))) return;
  load().then(()=>{ if(confirming || r !== route()) return; error = ""; render(); }).catch(e=>{ if(e.code === "session") fail(e); });
}
setInterval(tick, 20000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tick(); });
window.addEventListener("hashchange", show);

(function start(){
  if(store.get("theme") === "light") document.documentElement.dataset.theme = "light";
  if(store.get("size") === "big") document.documentElement.dataset.size = "big";
  // Ancien lien famille (#c=…) ou ancienne page de gestion : ils ne donnent plus accès à rien
  if(/^(c=|gestion|quitter)/.test(route())){
    history.replaceState(null, "", location.pathname);
    if(!token){ paint(loginView("Le site a changé : chacun a maintenant son identifiant et son code. Demande ton lien d'invitation.")); return; }
  }
  show();
})();
</script>
