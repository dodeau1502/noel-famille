# Toute adresse renvoie la page d'attente avec le code 503 (la surveillance voit bien que l'appli est absente).
server {
  listen 80;
  root /usr/share/nginx/html;
  charset utf-8;
  error_page 503 /index.html;
  location / { return 503; }
  location = /index.html {
    internal;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "30" always;
  }
}
